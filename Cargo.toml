[package]
name = "side-route-daemon"
version = "0.1.0"
edition = "2021"
description = "A robust IPv6 side-routing controller with failover and inbound protection for OpenWrt"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
